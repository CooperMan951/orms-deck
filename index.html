<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>ORMS Deck</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORMS Deck">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121212;
    --panel: #1b1b1d;
    --key: #1f1f22;
    --key-border: #303033;
    --hairline: #2c2c2e;
    --amber: #ff7a1a;
    --amber-dim: #7a3d10;
    --focus-green: #6fdc8c;
    --text: #ececec;
    --text-muted: #8a8a8d;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--display);}
  body{
    min-height:100vh;
    min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .top-plate{
    width:100%;
    max-width:720px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:18px 22px;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand-block{display:flex;align-items:center;gap:14px;}
  .aperture{width:40px;height:40px;flex-shrink:0;}
  .aperture svg{width:100%;height:100%;display:block;}
  .aperture-blade{
    transform-origin:50% 50%;
    animation: iris-open 900ms cubic-bezier(.2,.9,.3,1) 200ms both;
  }
  @keyframes iris-open{
    0%{ transform: rotate(0deg) scale(0.35); opacity:0; }
    60%{ opacity:1; }
    100%{ transform: rotate(0deg) scale(1); opacity:1; }
  }
  .brand-text h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    font-family:var(--mono);
  }
  .readout{
    font-family:var(--mono);
    font-size:11px;
    color:var(--focus-green);
    text-align:right;
    line-height:1.6;
  }
  .readout .dim{color:var(--text-muted);}

  .deck{
    width:100%;
    max-width:720px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,220px));
    gap:14px;
    justify-content:center;
  }

  .key{
    position:relative;
    background:var(--key);
    border:1px solid var(--key-border);
    border-radius:16px;
    padding:22px 16px 18px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    min-height:132px;
    text-decoration:none;
    color:var(--text);
    cursor:pointer;
    transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    -webkit-tap-highlight-color: transparent;
    overflow:hidden;
  }
  .key::before,.key::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border:2px solid transparent;
    transition: border-color 150ms ease;
  }
  .key::before{ top:8px; left:8px; border-right:none; border-bottom:none; border-top-left-radius:6px; }
  .key::after{ bottom:8px; right:8px; border-left:none; border-top:none; border-bottom-right-radius:6px; }
  .key:hover, .key:focus-visible{
    border-color:var(--amber-dim);
    transform:translateY(-2px);
    outline:none;
  }
  .key:hover::before, .key:hover::after,
  .key:focus-visible::before, .key:focus-visible::after{
    border-color:var(--amber);
  }
  .key:active{ transform:translateY(0) scale(0.98); }

  .key.locked{
    cursor:default;
    border-style:dashed;
    opacity:0.55;
  }
  .key.locked:hover{ transform:none; border-color:var(--key-border); }
  .key.locked:hover::before, .key.locked:hover::after{ border-color:transparent; }

  .key-icon{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:rgba(255,122,26,0.12);
    color:var(--amber);
  }
  .key.locked .key-icon{ background:rgba(255,255,255,0.05); color:var(--text-muted); }
  .key-icon svg{ width:19px; height:19px; }

  .key-label{
    font-size:14.5px;
    font-weight:500;
    line-height:1.3;
    margin-top:14px;
  }
  .key-meta{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-top:5px;
  }
  .key-meta.pending{ color:var(--amber); }

  footer{
    margin-top:26px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-muted);
    letter-spacing:0.5px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .aperture-blade{ animation:none; }
  }
</style>
</head>
<body>

  <div class="top-plate">
    <div class="brand-block">
      <div class="aperture">
        <svg viewBox="0 0 100 100">
          <g fill="none" stroke="#ff7a1a" stroke-width="2">
            <circle cx="50" cy="50" r="46" opacity="0.25"/>
          </g>
          <g fill="#ff7a1a">
            <polygon class="aperture-blade" style="animation-delay:60ms" points="50,50 50,8 66,14" />
            <polygon class="aperture-blade" style="animation-delay:110ms" points="50,50 88,26 82,44" />
            <polygon class="aperture-blade" style="animation-delay:160ms" points="50,50 92,62 74,78" />
            <polygon class="aperture-blade" style="animation-delay:210ms" points="50,50 58,92 40,86" />
            <polygon class="aperture-blade" style="animation-delay:260ms" points="50,50 12,74 18,56" />
            <polygon class="aperture-blade" style="animation-delay:310ms" points="50,50 8,38 26,22" />
          </g>
          <circle cx="50" cy="50" r="12" fill="#121212"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>ORMS Deck</h1>
        <p>Internal app launcher</p>
      </div>
    </div>
    <div class="readout" id="readout">
      <div id="readout-date">--</div>
      <div class="dim" id="readout-status">standby</div>
    </div>
  </div>

  <div class="deck" id="deck"></div>

  <footer>Cape Town &nbsp;/&nbsp; Bellville &nbsp;/&nbsp; Somerset &nbsp;&mdash;&nbsp; built with Claude</footer>

<script>
  var APPS = [
    {
      label: "Repair Tracker",
      meta: "Live",
      url: "https://cooperman951.github.io/repair-tracker/",
      icon: 'wrench',
      locked: false
    },
    {
      label: "Enquiry Desk",
      meta: "Live",
      url: "https://cooperman951.github.io/enquiry-desk/",
      icon: 'clipboard',
      locked: false
    },
    {
      label: "Stock Orders",
      meta: "Live",
      url: "https://cooperman951.github.io/stock-orders/",
      icon: 'box',
      locked: false
    },
    {
      label: "DJI Drone Explorer",
      meta: "Live",
      url: "https://cooperman951.github.io/orms-deck/drones/",
      icon: 'drone',
      locked: false
    },
    {
      label: "DJI Gimbal Explorer",
      meta: "Live",
      url: "https://cooperman951.github.io/orms-deck/gimbals/",
      icon: 'gimbal',
      locked: false
    }
  ];

  var ICONS = {
    wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    desktop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    drone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 9 4 4M15 9l5-5M9 15l-5 5M15 15l5 5"/><circle cx="4" cy="4" r="1.6"/><circle cx="20" cy="4" r="1.6"/><circle cx="4" cy="20" r="1.6"/><circle cx="20" cy="20" r="1.6"/></svg>',
    gimbal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.2"/><ellipse cx="12" cy="12" rx="4.2" ry="10"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'
  };

  var deck = document.getElementById('deck');

  APPS.forEach(function(app){
    var el = document.createElement(app.locked ? 'div' : 'a');
    el.className = 'key' + (app.locked ? ' locked' : '');
    if (!app.locked){
      el.href = app.url;
      el.target = '_blank';
      el.rel = 'noopener';
    } else {
      el.setAttribute('role', 'button');
      el.setAttribute('aria-disabled', 'true');
    }

    var iconWrap = document.createElement('div');
    iconWrap.className = 'key-icon';
    iconWrap.innerHTML = ICONS[app.icon] || '';
    el.appendChild(iconWrap);

    var labelWrap = document.createElement('div');
    var label = document.createElement('div');
    label.className = 'key-label';
    label.textContent = app.label;
    var meta = document.createElement('div');
    meta.className = 'key-meta' + (app.locked ? ' pending' : '');
    meta.textContent = app.meta;
    labelWrap.appendChild(label);
    labelWrap.appendChild(meta);
    el.appendChild(labelWrap);

    deck.appendChild(el);
  });

  function updateReadout(){
    var now = new Date();
    var dateStr = now.toLocaleDateString('en-ZA', { weekday:'short', day:'2-digit', month:'short' });
    var timeStr = now.toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('readout-date').textContent = dateStr + ' ' + timeStr;
  }
  updateReadout();
  setInterval(updateReadout, 30000);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
